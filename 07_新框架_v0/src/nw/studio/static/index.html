<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="studio-source" content="__STUDIO_SOURCE_SHA256__">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>叙事 · 小说生产客户端 v3</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234F7CFF'/%3E%3Cpath d='M8 8h6l4 16h6M8 24l4-16h6l6 16' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <div class="app-shell" id="appShell">
    <header class="topbar">
      <a class="brand" href="#/home" aria-label="叙事首页"><span class="brand-mark">叙</span><strong>叙事</strong><span class="brand-version">STUDIO / 03</span></a>
      <button class="icon-button" id="btnSidebarToggle" title="侧栏 · Ctrl+B" aria-label="折叠侧栏"></button>
      <select id="globalProjectSelect" aria-label="当前小说"><option value="">选择一本小说</option></select>
      <button class="search-trigger" id="searchTrigger"><span id="searchIcon"></span><span>搜索小说、类型与页面</span><kbd>Ctrl K</kbd></button>
      <button class="run-pill" id="runPill" hidden></button>
      <button class="icon-button" id="btnNotifications" title="待你处理" aria-label="待你处理"></button>
      <button class="icon-button" id="btnThemeToggle" title="切换主题" aria-label="切换主题"></button>
    </header>
    <nav class="activity-bar" id="activityBar" aria-label="一级导航"></nav>
    <aside class="sidebar" id="sidebar" aria-label="页面侧栏"><div id="sidebarContent"></div></aside>
    <div class="resize-handle" id="sidebarResize" role="separator" aria-label="调整侧栏宽度" aria-orientation="vertical" tabindex="0"></div>
    <main class="main-stage" id="mainStage">
      <div class="breadcrumb" id="breadcrumb"><span>工作空间</span><span>/</span><span id="breadcrumbPage">首页</span><span class="breadcrumb-tail">每个故事，从这里开始</span></div>
      <div class="content-area" id="contentArea" tabindex="-1"></div>
      <section class="bottom-panel" id="bottomPanel" hidden aria-label="运行面板"><div class="panel-tabs" id="panelTabs"></div><div class="panel-body" id="panelBody"></div></section>
    </main>
    <aside class="inspector" id="inspector" hidden aria-label="质量检查面板"><div id="inspectorContent"></div></aside>
    <footer class="statusbar"><button id="statusPanel">运行面板</button><span id="statusModel">模型待检查</span><span id="statusBudget">调用 —</span><span id="statusTask">就绪</span><span class="status-spacer"></span><button id="statusGit" title="查看 GitHub 仓库与同步状态">GitHub 待检查</button><span id="statusWords">0 字</span><button id="statusGuards">守卫 0</button><span id="statusConnection">连接中</span></footer>
  </div>
  <dialog id="modalBackdrop" class="modal"><header class="modal-header"><h2 id="modalTitle"></h2><button class="icon-button" data-close-modal aria-label="关闭对话框">×</button></header><div id="modalBody" class="modal-body"></div><footer id="modalFooter" class="modal-footer"></footer></dialog>
  <dialog id="drawer" class="drawer"><header class="modal-header"><h2 id="drawerTitle"></h2><button class="icon-button" data-close-drawer aria-label="关闭详情">×</button></header><div id="drawerBody" class="drawer-body"></div></dialog>
  <dialog id="searchOverlay" class="search-overlay"><div class="search-box"><input id="searchInput" placeholder="输入书名、类型或页面…" aria-label="全局搜索"><button class="ghost" data-close-search>Esc</button></div><div id="searchResults" class="search-results"></div></dialog>
  <dialog id="notificationPanel" class="drawer"><header class="modal-header"><h2>待你处理</h2><button class="icon-button" data-close-notifications aria-label="关闭通知">×</button></header><div id="notificationList" class="drawer-body"></div></dialog>
  <div id="toastBanner" class="toast-stack" role="status" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
