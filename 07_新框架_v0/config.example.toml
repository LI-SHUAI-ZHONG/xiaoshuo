# 示例不含密钥。复制为 config.toml 后修改；不要覆盖已有个人配置。
[paths]
workspace = "workspace" # 相对路径按配置文件所在目录解析

[model]
provider = "openai_compat"
base_url = "" # 在客户端设置中填写服务地址，例如 https://你的服务/v1
model = "" # 填写服务商提供的实际模型名称
api_key_env = "NW_API_KEY" # 只写环境变量名，不能写密钥
timeout = 120

[params]
temperature = 0.7
# 需要时可配置兼容 API 的 max_tokens 或 max_completion_tokens。
# 可选：按步骤覆盖同一 API 的模型：
# [stage_models]
# write = "服务商支持的写作模型名称"
# revise = "服务商支持的审稿模型名称"
# expression_design = { model = "服务商支持的设计模型名称", params = { temperature = 0.6 } }
