[project]
name = "accos-core"
version = "0.0.0"
description = "ACCOS modular-monolith core package skeleton"
requires-python = "==3.12.14"
dependencies = [
    "alembic==1.19.1",
    "argon2-cffi==25.1.0",
    "pycryptodome==3.23.0",
    "celery==5.6.3",
    "fastapi==0.141.1",
    "httpx2==2.12.0",
    "minio==7.2.20",
    "psycopg[binary]==3.3.5",
    "pydantic==2.13.5",
    "redis==8.1.0",
    "sqlalchemy==2.0.52",
    "uvicorn==0.52.4",
]

[project.scripts]
accos-api = "accos.entrypoints.api:main"
accos-worker = "accos.entrypoints.worker:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/accos"]

[tool.hatch.build.targets.wheel.force-include]
"resources" = "accos/resources"
